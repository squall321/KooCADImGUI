version: '3.8'

services:
  # PostgreSQL - Metadata storage
  postgres:
    image: postgres:16-alpine
    container_name: koocad-postgres
    environment:
      POSTGRES_USER: koocad
      POSTGRES_PASSWORD: koocad_dev_password
      POSTGRES_DB: koocad
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koocad"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: koocad-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO - Object storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: koocad-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: koocad
      MINIO_ROOT_PASSWORD: koocad_dev_password
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client - Create initial buckets
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set koocad http://minio:9000 koocad koocad_dev_password;
      /usr/bin/mc mb koocad/cad-files --ignore-existing;
      /usr/bin/mc mb koocad/exports --ignore-existing;
      /usr/bin/mc mb koocad/meshes --ignore-existing;
      /usr/bin/mc mb koocad/screenshots --ignore-existing;
      /usr/bin/mc anonymous set download koocad/exports;
      echo 'MinIO buckets created successfully';
      "

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: koocad-api
    command: uvicorn koocad.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://koocad:koocad_dev_password@postgres:5432/koocad
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: koocad
      MINIO_SECRET_KEY: koocad_dev_password
      MINIO_SECURE: "false"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: koocad-worker
    command: celery -A koocad.batch.worker worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://koocad:koocad_dev_password@postgres:5432/koocad
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: koocad
      MINIO_SECRET_KEY: koocad_dev_password
      MINIO_SECURE: "false"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
      - minio

  # Flower - Celery monitoring
  flower:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: koocad-flower
    command: celery -A koocad.batch.worker flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: koocad-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: koocad-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: koocad-network
