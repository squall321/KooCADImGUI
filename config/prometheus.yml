global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'koocad-api'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'koocad-worker'
    static_configs:
      - targets: ['worker:9091']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
